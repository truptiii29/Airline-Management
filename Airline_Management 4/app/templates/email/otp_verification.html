<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .logo { font-size: 24px; font-weight: bold; color: #0056b3; margin-bottom: 20px; text-align: center; }
        .otp-box { font-size: 32px; font-weight: bold; padding: 15px; margin: 20px 0; background: #f4f4f4; border: 1px dashed #0056b3; text-align: center; color: #000; letter-spacing: 5px; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✈️ Modern Airways</div>
        <h2>Hello, {{ passenger_name }}!</h2>
        <p>Your One-Time Password (OTP) for verification is:</p>
        <div class="otp-box">{{ otp_code }}</div>
        <p>This OTP expires in <strong>{{ expiry_minutes }} minutes</strong>.</p>
        <p style="color: #d9534f; font-weight: bold;">SECURITY WARNING: Please do not share this code with anyone.</p>
        <div class="footer">
            <p>&copy; 2026 Modern Airways. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
